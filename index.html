<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tells phones to use their real screen width instead of pretending to be a desktop -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Scaler</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Recipe Scaler</h1>
      <p>Enter how many people you're cooking for, and see the right ingredient amounts.</p>
    </header>

    <main>
      <!-- Region 1: paste a recipe in as plain text. script.js parses it and
           fills in the editor rows below (region 2). The textarea is the
           real way in - pasting with Ctrl/Cmd+V always works here. The
           "Paste from clipboard" button is only a shortcut for that same
           textarea; see handlePasteButton() in script.js. -->
      <section id="paste-area">
        <h2>Add a Recipe</h2>
        <textarea
          id="paste-textarea"
          rows="8"
          placeholder="Paste your recipe here…"
        ></textarea>
        <div class="paste-buttons">
          <button type="button" id="paste-button">Paste from clipboard</button>
          <button type="button" id="read-recipe-button">Read recipe</button>
        </div>
      </section>

      <!-- Region 2: the editor. The single surface a user types a recipe into.
           Pre-filled by script.js with exampleRecipe on page load. -->
      <section id="editor">
        <h2>Your Recipe</h2>

        <!-- Filled in by script.js after a paste is read, e.g. "Read 9 of
             10 lines. Check the marked one." Empty until then. -->
        <p id="review-notice"></p>

        <!-- Chunk 8: the recipe is saved in this browser automatically as it's
             edited (see saveRecipes() in script.js). This button is the way
             back to the pancake example for anyone who has saved a mess. -->
        <button type="button" id="reset-button">Start over (reset to example)</button>

        <div class="editor-field">
          <label for="recipe-name">Recipe name</label>
          <input type="text" id="recipe-name" />
        </div>

        <div class="editor-field">
          <label for="recipe-servings">Makes</label>
          <input type="number" id="recipe-servings" min="1" />
          <span>servings</span>
        </div>

        <!-- Filled in by script.js with one row per ingredient -->
        <div id="ingredient-rows"></div>

        <button type="button" id="add-ingredient-button">+ Add ingredient</button>
      </section>

      <div id="servings-control">
        <label for="servings-wanted">Cooking for</label>
        <input type="number" id="servings-wanted" value="4" min="1" />
        <span>people</span>
        <!-- Filled in by script.js with something like "×1.5" -->
        <span id="multiplier-display"></span>
      </div>

      <!-- Starts empty on purpose. script.js fills this in with the recipe. -->
      <div id="recipe"></div>
    </main>

    <!-- Loaded at the end of the body so the HTML above already exists when the script runs -->
    <script src="script.js"></script>
  </body>
</html>
