<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tells phones to use their real screen width instead of pretending to be a desktop -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Scaler</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Recipe Scaler</h1>
      <p>Enter how many people you're cooking for, and see the right ingredient amounts.</p>
    </header>

    <main>
      <!-- Starts empty on purpose. script.js fills it in, which proves the JavaScript ran. -->
      <p id="connection-status"></p>
    </main>

    <!-- Loaded at the end of the body so the HTML above already exists when the script runs -->
    <script src="script.js"></script>
  </body>
</html>
